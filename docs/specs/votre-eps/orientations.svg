    <line x1="130" y1="140" x2="130" y2="150" stroke="#000000" stroke-width="1" />
    <text x="80" y="155" text-anchor="middle" class="small-label">5 m</text>
    
    <line x1="230" y1="145" x2="300" y2="145" stroke="#000000" stroke-width="1" />
    <line x1="230" y1="140" x2="230" y2="150" stroke="#000000" stroke-width="1" />
    <line x1="300" y1="140" x2="300" y2="150" stroke="#000000" stroke-width="1" />
    <text x="265" y="155" text-anchor="middle" class="small-label">2 m</text>

    <line x1="340" y1="60" x2="340" y2="130" stroke="#000000" stroke-width="1" />
    <line x1="335" y1="60" x2="345" y2="60" stroke="#000000" stroke-width="1" />
    <line x1="335" y1="130" x2="345" y2="130" stroke="#000000" stroke-width="1" />
    <text x="350" y="100" text-anchor="middle" class="small-label" transform="rotate(90, 350, 100)">3 m</text>
    
    <text x="185" y="165" text-anchor="middle" class="box-subtitle">« Contrôler puis repartir »</text>
  </g>

  <!-- ================= MODULE 3 ================= -->
  <g transform="translate(20, 260)">
    <rect x="0" y="0" width="370" height="30" class="module-header" />
    <text x="10" y="20" class="box-title">MODULE 3</text>
    <text x="90" y="20" class="box-title">« Mirror Drill »</text>
    
    <rect x="0" y="35" width="370" height="140" fill="#ffffff" stroke="#1d3557" stroke-width="1.5" rx="5" />
    
    <!-- Terrain -->
    <rect x="110" y="50" width="150" height="100" fill="none" stroke="#000000" stroke-width="1.5" />
    
