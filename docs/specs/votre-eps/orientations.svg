    <text x="90" y="20" class="box-title">Freinage et relance</text>
    
    <rect x="0" y="35" width="370" height="140" fill="#ffffff" stroke="#1d3557" stroke-width="1.5" rx="5" />
    
    <!-- Terrain -->
    <rect x="30" y="60" width="300" height="70" fill="none" stroke="#000000" stroke-width="1.5" />
    <line x1="130" y1="60" x2="130" y2="130" class="dashed-line" />
    <line x1="230" y1="60" x2="230" y2="130" class="dashed-line" />
    
    <!-- Joueurs -->
    <text x="20" y="100" class="label">A</text>
