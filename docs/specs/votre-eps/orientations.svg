      <path d="M 15 50 L 30 50" fill="none" stroke="#457b9d" stroke-width="1" />
      <text x="15" y="45" class="small-label">90°</text>
    </g>

    <!-- Diagramme 180° -->
    <g transform="translate(250, 60)">
