    <!-- Flèches -->
    <path d="M 55 95 L 130 95" fill="none" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow-blue)" />
    <path d="M 160 95 L 235 95" fill="none" stroke="#e28743" stroke-width="2" marker-end="url(#arrow-orange)" />
    <path d="M 260 95 L 290 70" fill="none" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow-blue)" />
    
    <!-- Dimensions -->
    <line x1="30" y1="145" x2="130" y2="145" stroke="#000000" stroke-width="1" />
