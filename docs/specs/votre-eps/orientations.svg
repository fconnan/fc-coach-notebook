      <text x="40" y="-5" text-anchor="middle" class="label">180°</text>
      <circle cx="15" cy="65" r="8" class="player-blue" />
      <path d="M 15 65 L 15 25 A 20 20 0 0 1 55 25 L 55 65" fill="none" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow-blue)" />
      <text x="35" y="15" text-anchor="middle" class="small-label">180°</text>
    </g>
    
    <text x="185" y="165" text-anchor="middle" class="box-subtitle">« Parcours planifiés »</text>
  </g>

  <!-- ================= MODULE 2 ================= -->
  <g transform="translate(410, 90)">
