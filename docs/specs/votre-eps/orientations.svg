Voici le code SVG qui reproduit les 7 modules de votre infographie. 

J'ai créé un fichier SVG unique et structuré, avec des balises `<g>` pour chaque module afin que vous puissiez facilement les identifier, les modifier ou les séparer si besoin. Les couleurs, les flèches et les proportions ont été recréées pour être les plus fidèles possible à l'image d'origine.

Vous pouvez copier ce code et le coller dans un fichier texte en l'enregistrant avec l'extension `.svg` (par exemple `exercices_football.svg`), puis l'ouvrir dans n'importe quel navigateur web ou logiciel de retouche vectorielle (Illustrator, Inkscape, Figma).

```xml
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%">
  <defs>
    <!-- Styles de base -->
    <style>
      .title { font-family: Arial, sans-serif; font-weight: bold; fill: #1d3557; }
      .subtitle { font-family: Arial, sans-serif; fill: #457b9d; }
      .box-title { font-family: Arial, sans-serif; font-weight: bold; fill: #ffffff; font-size: 14px; }
      .box-subtitle { font-family: Arial, sans-serif; font-weight: bold; fill: #1d3557; font-size: 12px; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; font-weight: bold; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; }
      .field-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .dashed-line { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .player-blue { fill: #005b9f; stroke: #ffffff; stroke-width: 1.5; }
      .player-red { fill: #c00000; stroke: #ffffff; stroke-width: 1.5; }
      .ball { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .goal { fill: none; stroke: #00b050; stroke-width: 3; }
      .module-header { fill: #1d3557; rx: 5; }
    </style>

    <!-- Marqueurs de flèches -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#457b9d" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c00000" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e28743" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Titre principal -->
  <text x="400" y="40" text-anchor="middle" font-size="28" class="title">7 EXERCICES D'AGILITÉ AU FOOTBALL</text>
  <text x="400" y="65" text-anchor="middle" font-size="18" class="subtitle">Changement de direction, réaction et situations de jeu</text>

  <!-- ================= MODULE 1 ================= -->
  <g transform="translate(20, 90)">
    <!-- En-tête -->
    <rect x="0" y="0" width="370" height="30" class="module-header" />
    <text x="10" y="20" class="box-title">MODULE 1</text>
    <text x="90" y="20" class="box-title">Changements à 45°, 90° et 180°</text>
    
    <!-- Cadre principal -->
    <rect x="0" y="35" width="370" height="140" fill="#ffffff" stroke="#1d3557" stroke-width="1.5" rx="5" />
    
    <!-- Diagramme 45° -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="80" height="80" fill="none" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="40" y="-5" text-anchor="middle" class="label">45°</text>
      <circle cx="15" cy="65" r="8" class="player-blue" />
      <path d="M 15 65 Q 50 65 50 25" fill="none" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow-blue)" />
      <path d="M 15 65 Q 30 50 45 55" fill="none" stroke="#457b9d" stroke-width="1" />
      <text x="35" y="60" class="small-label">45°</text>
    </g>

    <!-- Diagramme 90° -->
    <g transform="translate(140, 60)">
      <rect x="0" y="0" width="80" height="80" fill="none" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="40" y="-5" text-anchor="middle" class="label">90°</text>
