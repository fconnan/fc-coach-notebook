<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Tête -->
  <circle cx="50" cy="28" r="16" fill="#1f6bb5" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Corps / Bras gauche -->
  <path d="M 35,42 C 15,55 12,85 25,100 C 30,105 38,100 38,90 C 38,78 25,65 28,52" 
        fill="#1f6bb5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        
  <!-- Corps / Bras droit -->
  <path d="M 65,42 C 85,55 88,85 75,100 C 70,105 62,100 62,90 C 62,78 75,65 72,52" 
        fill="#1f6bb5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        
  <!-- Jambe gauche -->
  <path d="M 26,95 L 24,112" fill="none" stroke="#1f6bb5" stroke-width="14" stroke-linecap="round"/>
  <path d="M 26,95 L 24,112" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Jambe droite -->
  <path d="M 74,95 L 76,112" fill="none" stroke="#1f6bb5" stroke-width="14" stroke-linecap="round"/>
  <path d="M 74,95 L 76,112" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Reflets internes (légèrement plus clairs) -->
  <path d="M 35,45 C 22,55 20,75 30,90" fill="none" stroke="#4a9be0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 65,45 C 78,55 80,75 70,90" fill="none" stroke="#4a9be0" stroke-width="4" stroke-linecap="round"/>
</svg>